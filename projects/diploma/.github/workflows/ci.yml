name: ci

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет ещё идущий прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt не прогнан:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: diploma
          POSTGRES_PASSWORD: diploma
          POSTGRES_DB: diploma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diploma -d diploma"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://diploma:diploma@localhost:5432/diploma?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - name: Миграции на пустую базу
        run: go run ./cmd/api -migrate
      - name: Тесты с гонками и покрытием
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Итог покрытия
        run: go tool cover -func=coverage.out | tail -1

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: goschool-diploma:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
